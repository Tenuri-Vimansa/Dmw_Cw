<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .login-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(135deg, #0d6efd, #003366);
            color: white;
            padding: 40px 20px;
            border-bottom-left-radius: 50% 10%;
            border-bottom-right-radius: 50% 10%;
            text-align: center;
            z-index: 1000;
        }
        
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 1100px;
            margin-top: 180px;
            gap: 40px;
            padding: 20px;
        }
        
        .login-image img {
            max-width: 600px;
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
            100% {
                transform: translateY(0);
            }
        }
        
        .login-card {
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            padding: 30px 25px;
            background: linear-gradient(135deg, #0d6efd, #6610f2);
            color: white;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
        
        .login-card h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .input-group-text {
            background-color: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
        }
        
        .login-form-control {
            border-radius: 0.375rem;
            height: 45px;
        }
        
        .btn-login {
            height: 45px;
            font-size: 15px;
            border-radius: 8px;
            background-color: #ffffff;
            color: #0d6efd;
            font-weight: bold;
            border: none;
        }
        
        .btn-login:hover {
            background-color: #eaf3ff;
        }
        
        .login-link {
            color: #ffe082;
            font-weight: 500;
            text-decoration: none;
        }
        
        .login-link:hover {
            color: #ffffff;
        }
    </style>
</head>

<body>

    <div class="login-header">
        <h1><i class="bi bi-box-arrow-in-right"></i> Patient Login</h1>
        <p>Access your portal to manage appointments and patients</p>
    </div>

    <div class="login-container">
        <div class="login-image">
            <img src="medical.jpg" alt="Medical Image" onerror="this.src='https://images.unsplash.com/photo-1576091160399-112ba8d25d1f?w=500&h=400&fit=crop&crop=center'">
        </div>
        <div class="login-card">
            <h2>Welcome back!</h2>
            <form name="loginForm" onsubmit="return validateForm()">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                        <input type="email" name="email" class="form-control login-form-control" placeholder="Enter your email">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" name="password" class="form-control login-form-control" placeholder="Enter your password">
                    </div>
                </div>
                <button type="submit" class="btn btn-login w-100 mt-2">Login</button>
            </form>
            <p class="mt-4 mb-0 text-center">
                Don't have an account?
                <a href="register.html" class="login-link">Register</a>
            </p>
        </div>
    </div>

    <script>
        function validateForm() {
            let email = document.forms["loginForm"]["email"].value.trim();
            let password = document.forms["loginForm"]["password"].value.trim();

            if (email === "") {
                alert("Email must be filled out");
                return false;
            }
            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(email)) {
                alert("Please enter a valid email address");
                return false;
            }
            if (password === "") {
                alert("Password must be filled out");
                return false;
            }
            if (password.length < 6) {
                alert("Password must be at least 6 characters long");
                return false;
            }
            return true;
        }
    </script>
</body>

</html>
