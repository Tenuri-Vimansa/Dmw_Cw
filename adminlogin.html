<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login - Life Bloom Hospital</title>

    <!-- Bootstrap Lux Theme -->
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.2/dist/lux/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
      .login-header {
        background: linear-gradient(135deg, #0d6efd, #001f3f);
        color: white;
        padding: 60px 20px;
        border-bottom-left-radius: 50% 10%;
        border-bottom-right-radius: 50% 10%;
        text-align: center;
      }

      .login-card {
        max-width: 450px;
        margin: -50px auto 40px auto;
        background: #fff;
        border-radius: 15px;
        padding: 40px;
        box-shadow: 0px 6px 20px rgba(0,0,0,0.2);
      }

      .btn-login {
        background-color: #0d6efd;
        color: white;
        border-radius: 10px;
        transition: 0.3s;
      }

      .btn-login:hover {
        background-color: #001f3f;
      }

      footer {
        background: #0d6efd;
        color: white;
        text-align: center;
        padding: 15px;
        margin-top: auto;
      }

      body {
        background-color: #f8f9fa;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>

  <body>
    <!-- Header -->
    <div class="login-header">
      <h1><i class="bi bi-shield-lock"></i> Admin Login</h1>
      <p>Secure access for administrators</p>
    </div>

    <!-- Login Card -->
    <div class="login-card">
      <form>
        <div class="mb-3">
          <label for="adminId" class="form-label">Admin ID / Email</label>
          <input type="text" class="form-control" id="adminId" placeholder="Enter ID or Email">
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Enter password">
        </div>
        <button type="submit" class="btn btn-login w-100">Login</button>
      </form>

      <div class="text-center mt-3">
        <p>Don’t have an account? <a href="admin-registration.html" class="text-decoration-none text-primary">Register here</a></p>
      </div>
    </div>

    <!-- Footer -->
    <footer>
      &copy; 2025 Life Bloom Hospital. All Rights Reserved.
    </footer>
  </body>
</html>
