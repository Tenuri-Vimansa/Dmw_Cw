<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Doctor - Life Bloom Hospital</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <div class="card mx-auto" style="max-width: 600px;">
      <div class="card-header text-center bg-primary text-white">
        <h3>Add New Doctor</h3>
      </div>
      <div class="card-body">
        <form id="addDoctorForm" action="#" method="POST" enctype="multipart/form-data">
          <div class="mb-3">
            <label for="name" class="form-label">Doctor Name:</label>
            <input type="text" class="form-control" id="name" name="name" placeholder="Enter full name">
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email:</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="Enter email">
          </div>

          <div class="mb-3">
            <label for="phone" class="form-label">Phone:</label>
            <input type="text" class="form-control" id="phone" name="phone" placeholder="Enter 10-digit number">
          </div>

          <div class="mb-3">
            <label for="specialty" class="form-label">Specialty:</label>
            <input type="text" class="form-control" id="specialty" name="specialty" placeholder="Enter specialty">
          </div>

          <button type="submit" class="btn btn-primary w-100">Add Doctor</button>
        </form>

        <div id="errorMessages" class="text-danger mt-3"></div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('addDoctorForm');
    form.addEventListener('submit', function(e) {
      e.preventDefault(); // stop default submission
      let errors = [];

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const specialty = document.getElementById('specialty').value.trim();

      const emailPattern = /^\S+@\S+\.\S+$/;

      if(name === '' || !/^[a-zA-Z\s]+$/.test(name)) {
        alert("Please enter a valid name (letters only).");
      }
      else if(email === '' || !emailPattern.test(email)) {
        alert("Please enter a valid email address.");
      }
      else if(phone === '' || !/^\d{10}$/.test(phone)) {
        alert("Please enter a 10-digit phone number.");
      }
      else if(specialty === '') {
        alert("Please enter the doctor's specialty.");
      }

      else if(errors.length > 0) {
        document.getElementById('errorMessages').innerHTML = errors.join('<br>');
      } else {
        alert("Form submitted successfully!"); // remove this and uncomment the next line for real submission
        // form.submit();
      }
    });
  </script>
</body>
</html>
