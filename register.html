<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .reg-card {
            max-width: 800px;
            width: 100%;
            padding: 30px;
            border-radius: 15px;
            background: linear-gradient(135deg, #0d6efd, #6610f2);
            color: #ffffff;
        }
        
        .reg-form-control,
        .reg-form-select,
        textarea {
            height: 50px;
            font-size: 16px;
            border-radius: 0.375rem;
            background-color: #ffffff;
            color: #000000;
        }
        
        textarea {
            height: auto;
        }
        
        .btn-register {
            height: 50px;
            font-size: 16px;
            background-color: #ffffff;
            color: #0d6efd;
            font-weight: bold;
            border: none;
            border-radius: 8px;
        }
        
        .btn-register:hover {
            background-color: #eaf3ff;
        }
        
        .reg-link {
            color: #ffe082;
            font-weight: 500;
            text-decoration: none;
        }
        
        .reg-link:hover {
            color: #ffffff;
            text-decoration: underline;
        }
        
        .input-group-text {
            background-color: rgba(255, 255, 255, 0.2);
            border: none;
            color: #ffffff;
            width: 45px;
            justify-content: center;
        }
        
        .login-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(135deg, #0d6efd, #003366);
            color: white;
            padding: 40px 20px;
            border-bottom-left-radius: 50% 10%;
            border-bottom-right-radius: 50% 10%;
            text-align: center;
            z-index: 1000;
        }
    </style>
</head>

<body>

    <div class="login-header">
        <h1><i class="bi bi-person-circle"></i> Patient Registration</h1>
        <p>Access your portal to manage appointments and patients</p>
    </div>

    <div class="reg-card shadow p-4">
        <h2 class="text-center mb-4"><i class="bi bi-person-plus-fill"></i> Patient Registration</h2>
        <form name="regForm" method="post" action="patientreh.php" onsubmit="return validateRegForm()">
            <div class="row g-3">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                            <input type="text" name="fullname" class="form-control reg-form-control" placeholder="Enter your full name">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                            <input type="email" name="email" class="form-control reg-form-control" placeholder="Enter your email">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-telephone-fill"></i></span>
                            <input type="tel" name="phone" class="form-control reg-form-control" placeholder="Enter your phone number">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Gender</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-gender-ambiguous"></i></span>
                            <select name="gender" class="form-select reg-form-select">
                                <option value="">Select Gender</option>
                                <option>Male</option>
                                <option>Female</option>
                                <option>Other</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-house-fill"></i></span>
                            <textarea name="address" class="form-control" rows="2" placeholder="Enter your address"></textarea>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" name="password" class="form-control reg-form-control" placeholder="Enter password">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" name="confirm_password" class="form-control reg-form-control" placeholder="Re-enter password">
                        </div>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-register w-100 mt-3">Register</button>
        </form>

        <p class="text-center mt-4">
            Already have an account?
            <a href="patientlogin.html" class="reg-link">Login</a>
        </p>
    </div>

    <script>
        function validateRegForm() {
            let form = document.forms["regForm"];
            let fullname = form["fullname"].value;
            let email = form["email"].value;
            let phone = form["phone"].value;
            let gender = form["gender"].value;
            let address = form["address"].value;
            let password = form["password"].value;
            let confirm_password = form["confirm_password"].value;

            if (fullname == "") {
                alert("Full name must be filled out");
                return false;
            }
            if (email == "") {
                alert("Email must be filled out");
                return false;
            }
            if (!email.includes("@")) {
                alert("Email must contain '@'");
                return false;
            }
            if (!email.includes(".")) {
                alert("Email must contain '.'");
                return false;
            }
            if (phone == "") {
                alert("Phone number must be filled out");
                return false;
            }
            if (gender == "") {
                alert("Please select your gender");
                return false;
            }
            if (address == "") {
                alert("Address must be filled out");
                return false;
            }
            if (password == "") {
                alert("Password must be filled out");
                return false;
            }
            if (password.length < 6) {
                alert("Password must be at least 6 characters long");
                return false;
            }
            if (confirm_password == "") {
                alert("Please confirm your password");
                return false;
            }
            if (confirm_password != password) {
                alert("Passwords do not match");
                return false;
            }
            return true;
        }
    </script>
</body>

</html>
