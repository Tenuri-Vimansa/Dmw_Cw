  <!-- Form Validation Script -->
  <script>
    document.getElementById("contactForm").addEventListener("submit", function(event) {
      event.preventDefault();

      let name = document.getElementById("name").value.trim();
      let email = document.getElementById("email").value.trim();
      let message = document.getElementById("message").value.trim();
      let alertBox = document.getElementById("alertBox");

      // Clear old alerts
      alertBox.innerHTML = "";

      if (name === "" || email === "" || message === "") {
        alertBox.innerHTML = `<div class="alert alert-danger"> Please fill in all fields!</div>`;
        return;
      }
      if (!/^[^ ]+@[^ ]+\.[a-z]{2,3}$/.test(email)) {
        alertBox.innerHTML = `<div class="alert alert-warning"> Please enter a valid email address!</div>`;
        return;
      }

      alertBox.innerHTML = `<div class="alert alert-success">Thank you..!, ${name}! Your message has been sent successfully.</div>`;
      document.getElementById("contactForm").reset();
    });
  </script>
